<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Car — Engenharia Automotiva</title>
  <meta name="description" content="Doctor Car — diagnóstico, manutenção e cuidados automotivos com precisão, transparência e tecnologia.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       RESET & VARIABLES
    ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #0b0c0d;
      --black2: #151617;
      --red: #e51c23;
      --red-dark: #b91016;
      --cream: #f5f5f2;
      --white: #fff;
      --gray: #777a7c;
      --line: #deded9;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--cream);
      color: #111;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================================================
       SCROLLBAR
    ========================================================= */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--black);
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--red);
    }

    /* =========================================================
       NAVBAR
    ========================================================= */
    .nav {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5.5%;
      z-index: 1000;
      color: var(--white);
      transition: background 0.35s, backdrop-filter 0.35s, height 0.35s, border-bottom 0.35s;
    }

    .nav.scrolled {
      height: 66px;
      background: rgba(11, 12, 13, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.8px;
    }

    .logo-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      background: var(--red);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      font-size: 12px;
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      gap: 34px;
      list-style: none;
      font-size: 12px;
      font-weight: 500;
      color: #d3d3d1;
    }

    .nav-links a {
      position: relative;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--white);
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--red);
      transition: 0.3s;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-phone {
      color: #cfcfcd;
      font-size: 11px;
    }

    .nav-cta {
      background: var(--white);
      color: #111;
      padding: 11px 18px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      transition: 0.3s;
    }

    .nav-cta:hover {
      background: var(--red);
      color: var(--white);
      transform: translateY(-2px);
    }

    /* =========================================================
       HERO
    ========================================================= */
    .hero {
      position: relative;
      min-height: 100vh;
      background: #080909;
      color: var(--white);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 150px 5.5% 80px;
    }

    .hero-number {
      position: absolute;
      right: 2%;
      top: 3%;
      font-family: "Manrope", sans-serif;
      font-size: clamp(250px, 35vw, 580px);
      line-height: 1;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.018);
      letter-spacing: -40px;
      user-select: none;
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
    }

    .hero-light {
      position: absolute;
      width: 800px;
      height: 800px;
      right: -200px;
      top: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 28, 35, 0.25), transparent 65%);
      filter: blur(30px);
      animation: lightMove 8s ease-in-out infinite alternate;
    }

    @keyframes lightMove {
      from { transform: translate(0, 0); }
      to { transform: translate(-120px, 50px); }
    }

    .hero-content {
      position: relative;
      z-index: 10;
      width: 48%;
      max-width: 680px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a8aaa9;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .eyebrow span {
      width: 35px;
      height: 1px;
      background: var(--red);
    }

    .hero h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(54px, 6.4vw, 98px);
      line-height: 0.9;
      letter-spacing: -6px;
      font-weight: 800;
      max-width: 750px;
      margin-bottom: 30px;
    }

    .hero h1 em {
      color: #a6a6a4;
      font-style: normal;
    }

    .hero-text {
      color: #999c9b;
      max-width: 500px;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px 21px;
      background: var(--red);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      border-radius: 2px;
      transition: 0.3s;
    }

    .primary:hover {
      background: #ff252d;
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(229, 28, 35, 0.25);
    }

    .secondary {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #aaa;
      font-size: 11px;
      font-weight: 600;
      padding: 16px 5px;
    }

    .secondary .arrow {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid #555;
      border-radius: 50%;
      transition: 0.
